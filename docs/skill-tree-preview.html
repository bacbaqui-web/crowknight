<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crow Knight · 기술의 서</title><link rel="stylesheet" href="./skill-tree-preview.css"></head>
<body>
<header><div><span class="eyebrow">CROW KNIGHT / TALENT TREE</span><h1>기술의 서</h1><p>하나의 포인트가, 다음 길을 엽니다.</p></div><a href="./skill-tree.html">효과·모션 설계 메모 ↗</a></header>
