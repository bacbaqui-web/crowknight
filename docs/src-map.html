<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crow Knight SRC Index</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2d;
        --line: #2b3a58;
        --text: #edf4ff;
        --muted: #9fb0ca;
        --blue: #59b8ff;
        --green: #70e2a2;
        --yellow: #ffd166;
        --red: #ff6b7a;
        --shadow: 0 16px 38px rgba(0, 0, 0, 0.3);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        line-height: 1.45;
      }

      .page {
        width: min(1360px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 42px;
      }

      .top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: end;
        margin-bottom: 16px;
      }

      .eyebrow {
        color: var(--blue);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 4px 0 8px;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1;
        letter-spacing: 0;
      }

      h2,
      h3,
      p {
        margin: 0;
      }

      p {
        color: var(--muted);
      }

      .doc-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .doc-link {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(18, 26, 45, 0.85);
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        font-weight: 850;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }

      .metric,
      .panel,
      .group-card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.012)), var(--panel);
        box-shadow: var(--shadow);
      }

      .metric {
        padding: 13px;
      }

      .metric b {
        display: block;
        color: #f5fbff;
        font-size: 26px;
        line-height: 1;
      }

      .metric span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .filters {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: minmax(260px, 1fr) 190px 160px 160px;
        gap: 10px;
        margin-bottom: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(11, 16, 32, 0.94);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
      }

      input,
      select {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #0d1526;
        color: var(--text);
        padding: 0 11px;
        font: inherit;
      }

      .panel {
        padding: 14px;
        margin-bottom: 12px;
      }

      .panel h2 {
        margin-bottom: 10px;
        font-size: 17px;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 8px;
        border: 1px solid rgba(89, 184, 255, 0.28);
        border-radius: 999px;
        background: rgba(89, 184, 255, 0.1);
        color: #cdeaff;
        font-size: 12px;
        font-weight: 850;
      }

      .pill.common {
        border-color: rgba(112, 226, 162, 0.34);
        background: rgba(112, 226, 162, 0.11);
        color: #ccf8dd;
      }

      .pill.dedicated {
        border-color: rgba(255, 209, 102, 0.34);
        background: rgba(255, 209, 102, 0.12);
        color: #ffe4a6;
      }

      .pill.large {
        border-color: rgba(255, 107, 122, 0.38);
        background: rgba(255, 107, 122, 0.12);
        color: #ffc6ce;
      }

      .suffix-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .suffix-card {
        display: grid;
        gap: 6px;
        min-height: 74px;
        padding: 10px;
        border: 1px solid rgba(43, 58, 88, 0.82);
        border-radius: 8px;
        background: rgba(8, 14, 26, 0.46);
      }

      .suffix-card span {
        color: var(--muted);
        font-size: 12px;
      }

      .groups {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .group-card {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .group-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        align-items: start;
      }

      .group-head h2 {
        font-size: 20px;
      }

      .info {
        display: grid;
        gap: 8px;
      }

      .info-row {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(43, 58, 88, 0.75);
        font-size: 13px;
      }

      .info-row b {
        color: #9ed8ff;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .js-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .js {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 7px;
        border: 1px solid rgba(89, 184, 255, 0.22);
        border-radius: 999px;
        background: rgba(8, 14, 26, 0.58);
        color: #dbeeff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 850;
      }

      .suffix-badge {
        display: inline-flex;
        align-items: center;
        min-height: 18px;
        padding: 0 6px;
        border: 1px solid rgba(159, 176, 202, 0.28);
        border-radius: 999px;
        background: rgba(159, 176, 202, 0.11);
        color: #d7e5f8;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        font-size: 10px;
        font-weight: 950;
        letter-spacing: 0.03em;
      }

      .suffix-badge.engine {
        border-color: rgba(112, 226, 162, 0.36);
        background: rgba(112, 226, 162, 0.13);
        color: #ccf8dd;
      }

      .suffix-badge.helper {
        border-color: rgba(89, 184, 255, 0.34);
        background: rgba(89, 184, 255, 0.13);
        color: #cdeaff;
      }

      .suffix-badge.adapter {
        border-color: rgba(181, 151, 255, 0.36);
        background: rgba(181, 151, 255, 0.13);
        color: #ded3ff;
      }

      .suffix-badge.controller {
        border-color: rgba(255, 209, 102, 0.34);
        background: rgba(255, 209, 102, 0.12);
        color: #ffe4a6;
      }

      .suffix-badge.renderer {
        border-color: rgba(255, 107, 122, 0.36);
        background: rgba(255, 107, 122, 0.12);
        color: #ffc6ce;
      }

      .suffix-badge.view {
        border-color: rgba(120, 220, 232, 0.35);
        background: rgba(120, 220, 232, 0.12);
        color: #c9f5fb;
      }

      .suffix-badge.state {
        border-color: rgba(255, 167, 89, 0.36);
        background: rgba(255, 167, 89, 0.12);
        color: #ffd8b6;
      }

      .suffix-badge.data {
        border-color: rgba(150, 234, 164, 0.35);
        background: rgba(150, 234, 164, 0.12);
        color: #d5f7dc;
      }

      .suffix-badge.factory {
        border-color: rgba(244, 142, 255, 0.34);
        background: rgba(244, 142, 255, 0.12);
        color: #facdff;
      }

      .suffix-badge.reader {
        border-color: rgba(145, 180, 255, 0.36);
        background: rgba(145, 180, 255, 0.12);
        color: #d5e1ff;
      }

      .suffix-badge.unknown {
        border-color: rgba(159, 176, 202, 0.24);
        background: rgba(159, 176, 202, 0.09);
        color: #c3cfdf;
      }

      .empty {
        display: none;
        padding: 28px;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 900px) {
        .top,
        .summary,
        .filters,
        .groups {
          grid-template-columns: 1fr;
        }

        .suffix-grid {
          grid-template-columns: 1fr;
        }

        .doc-links {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="top">
        <div>
          <div class="eyebrow">Crow Knight SRC Index</div>
          <h1>프로젝트 인덱스</h1>
          <p>필요한 JS 그룹만 빠르게 찾기 위한 화면이다. 설명서가 아니다.</p>
        </div>
        <nav class="doc-links" aria-label="문서 링크">
          <a class="doc-link" href="./10_SRC_MAP.md">10_SRC_MAP 원본</a>
          <a class="doc-link" href="./sprint-dashboard.html">Sprint Dashboard</a>
          <a class="doc-link" href="./99_CURRENT_SPRINT.md">Current Sprint</a>
        </nav>
      </header>

      <section id="summary" class="summary"></section>

      <section class="filters">
        <input id="searchInput" type="search" placeholder="파일명, 역할, 관련 JS, 주의 검색" />
        <select id="groupFilter" aria-label="그룹 필터">
          <option value="">전체 그룹</option>
        </select>
        <select id="statusFilter" aria-label="상태 필터">
          <option value="">전체 상태</option>
          <option value="common">공통 시스템</option>
          <option value="dedicated">전용 구현</option>
        </select>
        <select id="largeFilter" aria-label="큰 파일 필터">
          <option value="">전체</option>
          <option value="large">큰 파일 포함</option>
        </select>
      </section>

      <section class="panel">
        <h2>프로젝트 그룹</h2>
        <div class="pill-row">
          <span class="pill">Entry</span>
          <span class="pill">Editor</span>
          <span class="pill">Runtime</span>
          <span class="pill">Timeline</span>
          <span class="pill">Save</span>
          <span class="pill">Assets</span>
          <span class="pill">Data</span>
        </div>
      </section>

      <section class="panel">
        <h2>접미사 역할표</h2>
        <div id="suffixRoles" class="suffix-grid"></div>
      </section>

      <section id="groups" class="groups"></section>
      <div id="emptyState" class="empty">조건에 맞는 그룹이 없다.</div>
    </main>

    <script>
      const GROUPS = [
        {
          name: 'Selection',
          role: '현재 편집 대상을 결정.',
          status: 'common',
          js: ['selection_palette.js', 'part_editor_controller.js', 'selection_state.js', 'panel_edit_state.js'],
          caution: 'Selection과 EditTarget이 달라지면 Handle이 틀어진다.',
        },
        {
          name: 'Transform Editor (구 Canvas)',
          role: '화면에서 editable object의 transform drag 처리.',
          status: 'common',
          js: [
            'transform_editor_controller.js',
            'transform_edit_state.js',
            'transform_drag_helper.js',
            'transform_drag_factory.js',
            'transform_refresh_helper.js',
            'transform_drag_apply_helper.js',
            'transform_value_helper.js',
          ],
          caution: 'Property와 같은 저장 규칙을 사용한다.',
        },
        {
          name: 'Property',
          role: '선택 대상의 입력값 표시와 저장.',
          status: 'common',
          js: [
            'editable_property_helper.js',
            'property_field_groups.js',
            'property_value_helper.js',
            'property_scrub_helper.js',
            'property_numeric_input_helper.js',
          ],
          caution: '표시값과 저장값이 어긋나면 Transform Editor 결과와 달라진다.',
        },
        {
          name: 'Handle',
          role: 'Move/Resize/Rotate handle 위치와 표시.',
          status: 'common',
          js: [
            'transform_handle_geometry.js',
            'edit_handle_geometry_helper.js',
            'edit_handle_renderer.js',
            'edit_handle_drawing_helper.js',
          ],
          caution: 'Handle source와 render source가 같아야 한다.',
        },
        {
          name: 'Transform',
          role: 'x/y, ax/ay, w/h, rot 공통 규칙.',
          status: 'common',
          js: [
            'editable_object_model_helper.js',
            'editable_property_helper.js',
            'transform_drag_apply_helper.js',
            'transform_value_helper.js',
            'property_value_helper.js',
          ],
          caution: '모든 editable object가 같은 transform 의미를 써야 한다.',
        },
        {
          name: 'Timeline',
          role: '시간에 따른 값 저장.',
          status: 'common',
          js: [
            'timeline_controller.js',
            'timeline_engine.js',
            'timeline_command_helper.js',
            'timeline_drag_helper.js',
            'timeline_selection_helper.js',
            'timeline_preview_helper.js',
            'timeline_frame_reader.js',
            'timeline_keyframe_helper.js',
            'timeline_pose_adapter.js',
            'timeline_effect_adapter.js',
            'timeline_pose_controller.js',
            'timeline_effect_controller.js',
            'timeline_view.js',
            'timeline_renderer.js',
          ],
          caution: 'Action/Effect 모두 영향. 공통 engine에 전용 예외를 넣지 않는다.',
        },
        {
          name: 'InteractionObject',
          role: '공격/피격/충돌/방어 같은 상호작용 영역.',
          status: 'common',
          js: [
            'interaction_object_editor.js',
            'interaction_region_engine.js',
            'combat_engine.js',
            'editable_object_model_helper.js',
          ],
          caution: 'Runtime 계산값을 Editor source처럼 쓰지 않는다.',
        },
        {
          name: 'Save',
          role: '프로젝트 저장/불러오기.',
          status: 'common',
          js: [
            'project_state_controller.js',
            'project_storage_helper.js',
            'firebase_asset_storage.js',
            'firebase_ranking_storage.js',
          ],
          caution: 'Project save와 asset refresh를 섞지 않는다.',
        },
        {
          name: 'Runtime',
          role: 'Editor 데이터를 게임 실행 결과로 계산.',
          status: 'common',
          js: [
            'main.js',
            'actor_factory.js',
            'actor_runtime_engine.js',
            'actor_pose_helper.js',
            'actor_renderer.js',
            'actor_action_helper.js',
            'actor_canvas_renderer.js',
            'combat_engine.js',
            'world_renderer.js',
          ],
          caution: 'Runtime은 Editor 원본을 직접 수정하지 않는다.',
        },
        {
          name: 'Data',
          role: '기본값, normalize, schema, frame data.',
          status: 'common',
          js: [
            'game_config.js',
            'player_default_rig_data.js',
            'player_default_tuning_data.js',
            'project_data_normalizer.js',
            'animation_frame_data.js',
          ],
          caution: '저장 구조 변경은 별도 Sprint에서만 한다.',
        },
        {
          name: 'Stage',
          role: 'Stage 편집.',
          status: 'dedicated',
          js: [
            'stageRulesController.js',
            'stageRulesPanelController.js',
            'stageRulesPanelRenderer.js',
            'stageRulesState.js',
          ],
          caution: '아직 Common Editing에 흡수 안 됨.',
        },
        {
          name: 'HUD',
          role: 'Runtime HUD와 이름/HP 표시.',
          status: 'dedicated',
          js: ['characterHudLayout.js', 'runHud.js', 'rankingUi.js', 'rankingController.js'],
          caution: 'editable object 규칙과 완전히 통합되지 않았다.',
        },
        {
          name: 'Background',
          role: '배경 편집과 렌더.',
          status: 'dedicated',
          js: [
            'background_panel_controller.js',
            'background_panel_view.js',
            'background_renderer.js',
            'psd_background_helper.js',
          ],
          caution: 'Stage/Asset 흐름과 연결되어 있어 공통화 전 설계 필요.',
        },
        {
          name: 'Group Edit',
          role: '여러 파츠를 임시 Transform 대상으로 묶고 결과를 각 파츠에 분배.',
          status: 'dedicated',
          js: ['group_transform_adapter.js', 'group_edit_state.js'],
          caution: 'Group 전용 차이는 adapter에만 남긴다.',
        },
      ];

      const LARGE_FILES = [
        ['background_renderer.js', '482', 'Background render', '더 흡수 금지'],
        ['project_data_normalizer.js', '465', 'Normalize', '저장 구조 변경 주의'],
        ['actor_runtime_engine.js', '440', 'Runtime player', '더 흡수 금지'],
        ['editor_panel.js', '421', 'Editor shell', 'controller 연결만 유지'],
        ['actor_renderer.js', '394', 'Runtime render', 'Editor target 기록 경계 주의'],
        ['main.js', '380', 'Entry / loop', '책임 추가 금지'],
        ['timeline_effect_controller.js', '341', 'Effect timeline', '추가 흡수보다 glue 분리 유지'],
        ['player_default_rig_data.js', '336', 'Default rig', '저장 구조 변경 시 별도 Sprint'],
        ['part_editor_controller.js', '332', 'Selection/Property', '무리한 추가 금지'],
        ['combat_engine.js', '330', 'Runtime combat', 'Editor source와 분리'],
        ['timeline_pose_controller.js', '320', 'Action timeline', '추가 흡수보다 glue 분리 유지'],
      ];

      const SUFFIX_ROLES = [
        ['engine', '핵심 계산 / 규칙'],
        ['helper', '기능 하나 담당'],
        ['adapter', '대상 차이 연결'],
        ['controller', '사용자 입력 / 흐름 제어'],
        ['renderer', '실제 화면 출력'],
        ['view', '화면 구성'],
        ['state', '현재 상태'],
        ['data', '기본값 / 저장값 / 설정값'],
        ['factory', '객체 생성'],
        ['reader', '값 읽기'],
      ];

      function escapeHtml(value) {
        return String(value || '').replace(
          /[&<>"']/g,
          (char) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#039;',
            })[char]
        );
      }

      function statusLabel(status) {
        return status === 'common' ? '🟦 공통 시스템' : '🟨 전용 구현';
      }

      function statusClass(status) {
        return status === 'common' ? 'common' : 'dedicated';
      }

      function suffixForFile(file) {
        const name = String(file || '').replace(/\.js$/, '');
        const match = SUFFIX_ROLES.find(([suffix]) => name.endsWith(`_${suffix}`));
        return match ? match[0] : 'unknown';
      }

      function renderSuffixBadge(file) {
        const suffix = suffixForFile(file);
        const label = suffix === 'unknown' ? 'FILE' : suffix.toUpperCase();
        return `<span class="suffix-badge ${suffix}">${label}</span>`;
      }

      function renderJsFile(file) {
        return `<span class="js"><span>${escapeHtml(file)}</span>${renderSuffixBadge(file)}</span>`;
      }

      function renderSuffixRoles() {
        document.getElementById('suffixRoles').innerHTML = SUFFIX_ROLES.map(
          ([suffix, role]) => `
        <article class="suffix-card">
          <b>${renderSuffixBadge(`example_${suffix}.js`)}</b>
          <span>${escapeHtml(role)}</span>
        </article>
      `
        ).join('');
      }

      function renderSummary() {
        const common = GROUPS.filter((group) => group.status === 'common').length;
        const dedicated = GROUPS.length - common;
        const jsCount = new Set(GROUPS.flatMap((group) => group.js)).size;
        document.getElementById('summary').innerHTML = [
          ['기능 그룹', GROUPS.length],
          ['관련 JS', jsCount],
          ['공통 시스템', common],
          ['큰 파일', LARGE_FILES.length],
        ]
          .map(
            ([label, value]) => `
        <article class="metric">
          <b>${value}</b>
          <span>${escapeHtml(label)}</span>
        </article>
      `
          )
          .join('');
      }

      function renderGroupOptions() {
        document.getElementById('groupFilter').innerHTML += GROUPS.map(
          (group) => `<option value="${escapeHtml(group.name)}">${escapeHtml(group.name)}</option>`
        ).join('');
      }

      function groupHasLargeFile(group) {
        const largeNames = new Set(LARGE_FILES.map(([name]) => name));
        return group.js.some((name) => largeNames.has(name));
      }

      function matches(group, filters) {
        const haystack =
          `${group.name} ${group.role} ${group.js.join(' ')} ${group.caution} ${statusLabel(group.status)}`.toLowerCase();
        return (
          (!filters.search || haystack.includes(filters.search)) &&
          (!filters.group || group.name === filters.group) &&
          (!filters.status || group.status === filters.status) &&
          (!filters.large || groupHasLargeFile(group))
        );
      }

      function renderGroups() {
        const filters = {
          search: document.getElementById('searchInput').value.trim().toLowerCase(),
          group: document.getElementById('groupFilter').value,
          status: document.getElementById('statusFilter').value,
          large: document.getElementById('largeFilter').value === 'large',
        };
        const visible = GROUPS.filter((group) => matches(group, filters));
        document.getElementById('groups').innerHTML = visible
          .map(
            (group) => `
        <article class="group-card">
          <div class="group-head">
            <h2>${escapeHtml(group.name)}</h2>
            <div class="pill-row">
              <span class="pill ${statusClass(group.status)}">${statusLabel(group.status)}</span>
              ${groupHasLargeFile(group) ? '<span class="pill large">큰 파일 포함</span>' : ''}
            </div>
          </div>
          <div class="info">
            <div class="info-row"><b>역할</b><span>${escapeHtml(group.role)}</span></div>
            <div class="info-row"><b>관련 JS</b><div class="js-list">${group.js.map(renderJsFile).join('')}</div></div>
            <div class="info-row"><b>주의</b><span>${escapeHtml(group.caution)}</span></div>
          </div>
        </article>
      `
          )
          .join('');
        document.getElementById('emptyState').style.display = visible.length ? 'none' : 'block';
      }

      renderSummary();
      renderSuffixRoles();
      renderGroupOptions();
      renderGroups();

      ['searchInput', 'groupFilter', 'statusFilter', 'largeFilter'].forEach((id) => {
        document.getElementById(id).addEventListener('input', renderGroups);
        document.getElementById(id).addEventListener('change', renderGroups);
      });
    </script>
  </body>
</html>
