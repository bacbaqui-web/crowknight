<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crow Knight</title>
    <link rel="stylesheet" href="./src/sidePanels.css" />
    <link rel="stylesheet" href="./src/rankingScreens.css" />
    <link rel="stylesheet" href="./src/settingsPanel.css" />
    <link rel="stylesheet" href="./src/settingsTimeline.css" />
    <link rel="stylesheet" href="./src/settingsScrubControls.css" />
    <link rel="stylesheet" href="./src/partPicker.css" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="game-home full-stage">
    <main class="app-shell">
      <section class="stage-wrap player-stage" aria-label="게임 화면">
        <canvas id="game" width="960" height="540"></canvas>

        <div id="mobileGameControls" class="mobile-game-controls" aria-label="모바일 게임 조작" hidden>
          <div class="mobile-direction-pad" aria-label="방향 조작">
            <button class="direction-up" type="button" data-hold-code="ArrowUp" aria-label="위쪽">▲</button>
            <button class="direction-left" type="button" data-hold-code="ArrowLeft" aria-label="왼쪽">◀</button>
            <button class="direction-down" type="button" data-hold-code="ArrowDown" aria-label="아래쪽">▼</button>
            <button class="direction-right" type="button" data-hold-code="ArrowRight" aria-label="오른쪽">▶</button>
          </div>

          <div class="mobile-action-pad" aria-label="액션 조작">
            <button class="mobile-skill-button mobile-skill-w" type="button" data-hold-code="KeyW" aria-label="W 스킬">
              W
            </button>
            <button
              class="mobile-skill-button mobile-skill-space"
              type="button"
              data-hold-code="Space"
              aria-label="스페이스 스킬"
            >
              SPACE
            </button>
            <button class="mobile-primary-action" type="button" data-hold-code="KeyQ" aria-label="Q 공격">
              <span>Q</span>
            </button>
          </div>
        </div>

        <div class="run-hud" aria-label="플레이 기록">
          <div class="run-hud-item" aria-label="생존 시간">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8"></circle>
              <path d="M12 7v5l3 2"></path>
            </svg>
            <span id="hudSurvivalTime">0:00</span>
          </div>
          <div class="run-hud-item" aria-label="잡몹 처치 수">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3c-4 0-7 2.8-7 6.8 0 2.4 1.2 4.4 3 5.6V20h8v-4.6c1.8-1.2 3-3.2 3-5.6C19 5.8 16 3 12 3z"
              ></path>
              <circle class="skull-eye" cx="9.2" cy="10.4" r="1.2"></circle>
              <circle class="skull-eye" cx="14.8" cy="10.4" r="1.2"></circle>
              <path d="M11 14h2"></path>
              <path d="M9.5 17v3"></path>
              <path d="M12 17v3"></path>
              <path d="M14.5 17v3"></path>
            </svg>
            <span id="hudKills">0</span>
          </div>
          <div class="run-hud-item" aria-label="보스 처치 수">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 17 3 7l5 4 4-7 4 7 5-4-1 10z"></path>
              <path d="M4 20h16"></path>
            </svg>
            <span id="hudBossKills">0</span>
          </div>
        </div>

        <button
          id="controlGuideButton"
          class="control-guide-button"
          type="button"
          aria-controls="gameControlGuide"
          aria-expanded="false"
          hidden
        >
          조작법
        </button>

        <aside id="gameControlGuide" class="game-control-guide" aria-label="조작법" hidden>
          <h2>조작법</h2>
          <dl>
            <div>
              <dt>← →</dt>
              <dd>이동</dd>
            </div>
            <div>
              <dt>← ← / → →</dt>
              <dd>질주</dd>
            </div>
            <div>
              <dt>Space</dt>
              <dd>점프</dd>
            </div>
            <div>
              <dt>Q</dt>
              <dd>공격</dd>
            </div>
            <div>
              <dt>W</dt>
              <dd>구르기</dd>
            </div>
            <div>
              <dt>↑ + W</dt>
              <dd>백플립</dd>
            </div>
            <div>
              <dt>공중 + Q</dt>
              <dd>점프공격</dd>
            </div>
            <div>
              <dt>공중 + ↓ + Q</dt>
              <dd>낙하공격</dd>
            </div>
          </dl>
        </aside>

        <div id="encouragementBubbles" class="encouragement-bubbles" aria-label="응원 말풍선"></div>
        <div id="bossHealNotice" class="boss-heal-notice" hidden role="status" aria-live="polite">HP+1</div>
        <div id="difficultyWarning" class="difficulty-warning" hidden role="status" aria-live="polite"></div>

        <div id="startScreen" class="start-screen">
          <picture>
            <source media="(max-width: 820px)" srcset="./assets/title/crow_knight_title.webp" />
            <img class="title-logo" src="./assets/title/crow_knight_title_2.webp" alt="Crow Knight" />
          </picture>
          <button id="homeStart" class="primary-start" type="button">PLAY</button>
        </div>

        <div id="resultScreen" class="result-screen" hidden>
          <img class="result-title-top" src="./assets/title/dashboard_top.webp" alt="" />
          <div class="result-panel">
            <section class="ranking-board" aria-labelledby="rankingTitle">
              <h2 id="rankingTitle">랭킹</h2>
              <ol id="rankingList" class="ranking-list"></ol>
            </section>

            <section class="score-register" aria-label="게임 결과와 랭킹 등록">
              <dl class="score-total">
                <div>
                  <dt>총점</dt>
                  <dd id="resultScore">0</dd>
                </div>
              </dl>
              <dl class="score-breakdown">
                <div>
                  <dt>생존</dt>
                  <dd id="resultSurvival">0:00</dd>
                </div>
                <div>
                  <dt>잡몹 처치</dt>
                  <dd id="resultKills">0</dd>
                </div>
                <div>
                  <dt>보스 처치</dt>
                  <dd id="resultBossKills">0</dd>
                </div>
              </dl>
              <form id="rankingForm" class="ranking-form">
                <label>
                  <span>이름</span>
                  <input id="rankingName" type="text" maxlength="12" autocomplete="name" required />
                </label>
                <label>
                  <span>하고 싶은 말</span>
                  <textarea id="rankingMessage" maxlength="20" rows="2"></textarea>
                </label>
                <button type="submit">랭킹등록하기</button>
              </form>
            </section>

            <nav class="result-actions" aria-label="결과 메뉴">
              <button id="retryRun" class="icon-action" type="button" aria-label="다시하기">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M16.02 9.35h4.99V4.36"></path>
                  <path d="M21.01 9.35 17.83 6.17A8.25 8.25 0 0 0 4.03 9.87"></path>
                  <path d="M7.98 14.65H2.99v4.99"></path>
                  <path d="M2.99 14.65 6.17 17.83A8.25 8.25 0 0 0 19.97 14.13"></path>
                </svg>
              </button>
              <a
                class="icon-action lezhin-action"
                href="https://www.lezhin.com/ko/comic/crowknight"
                target="_blank"
                rel="noreferrer"
                aria-label="까마귀기사 보러가기"
              >
                <img src="./assets/icons/lezhin.svg" alt="" />
              </a>
              <a
                class="icon-action"
                href="https://www.instagram.com/govy9807"
                target="_blank"
                rel="noreferrer"
                aria-label="인스타그램"
              >
                <img src="./assets/icons/instagram.svg" alt="" />
              </a>
              <a
                class="icon-action"
                href="https://x.com/govy9807"
                target="_blank"
                rel="noreferrer"
                aria-label="트위터 X"
              >
                <img src="./assets/icons/x.svg" alt="" />
              </a>
            </nav>
          </div>
          <img class="result-title-bottom" src="./assets/title/dashboard_bottom.webp" alt="" />
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
