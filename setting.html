<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crow Knight Settings</title>
    <link rel="stylesheet" href="./src/sidePanels.css" />
    <link rel="stylesheet" href="./src/rankingScreens.css" />
    <link rel="stylesheet" href="./src/settingsPanel.css" />
    <link rel="stylesheet" href="./src/settingsPanelControls.css" />
    <link rel="stylesheet" href="./src/settingsBackgroundPanel.css" />
    <link rel="stylesheet" href="./src/settingsTimeline.css" />
    <link rel="stylesheet" href="./src/settingsScrubControls.css" />
    <link rel="stylesheet" href="./src/partPicker.css" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="settings-page full-stage">
    <main class="app-shell">
      <aside class="settings-ranking-panel" aria-labelledby="settingsRankingTitle">
        <button
          id="rankingToggle"
          class="side-panel-toggle ranking-panel-toggle"
          type="button"
          aria-label="랭킹 접기"
          aria-expanded="true"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 6l-6 6 6 6"></path>
          </svg>
        </button>
        <h2 id="settingsRankingTitle">랭킹</h2>
        <div class="settings-ranking-head" aria-hidden="true">
          <span>이름</span>
          <span>점수</span>
          <span>기록</span>
          <span>메세지</span>
        </div>
        <ol id="settingsRankingList" class="settings-ranking-list"></ol>
      </aside>
      <section class="stage-wrap" aria-label="게임 화면">
        <canvas id="game" width="960" height="540"></canvas>
        <div class="control-hint" aria-label="조작키">
          <button type="button" data-hold-code="ArrowLeft"><kbd>←</kbd><span>이동</span></button>
          <button type="button" data-hold-code="ArrowRight"><kbd>→</kbd><span>이동</span></button>
          <button type="button" data-hold-code="Space"><kbd>Space</kbd><span>점프</span></button>
          <button type="button" data-tap-code="KeyQ"><kbd>Q</kbd><span>공격</span></button>
          <button type="button" data-tap-code="KeyW"><kbd>W</kbd><span>구르기</span></button>
          <button type="button" data-hold-code="KeyE"><kbd>E</kbd><span>방어</span></button>
          <label class="screen-zoom-control" title="화면 확대">
            <span>화면</span>
            <input id="screenZoomRange" type="range" min="1" max="3" step="0.1" value="1" />
            <output id="screenZoomValue" for="screenZoomRange">1.0x</output>
          </label>
        </div>
        <div class="battle-controls" aria-label="전투 제어">
          <button id="startBattle" type="button">전투 시작</button>
          <button id="endBattle" type="button" disabled>전투 끝</button>
        </div>
        <button
          id="settingsToggle"
          class="settings-toggle side-panel-toggle"
          type="button"
          aria-label="설정 열기"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 6l-6 6 6 6"></path>
          </svg>
        </button>
      </section>

      <div id="panelBackdrop" class="panel-backdrop" hidden></div>
      <aside id="tuningPanel" class="tuning-panel" aria-label="캐릭터 설정" aria-hidden="true">
        <header class="panel-header">
          <div class="panel-actions">
            <button
              id="firebaseUpload"
              class="icon-button"
              type="button"
              aria-label="Firebase 업로드"
              title="Firebase 업로드"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 16V4"></path>
                <path d="M7 9l5-5 5 5"></path>
                <path d="M5 20h14"></path>
              </svg>
            </button>
            <button
              id="firebaseDownload"
              class="icon-button"
              type="button"
              aria-label="Firebase 다운로드"
              title="Firebase 다운로드"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 4v12"></path>
                <path d="M7 11l5 5 5-5"></path>
                <path d="M5 20h14"></path>
              </svg>
            </button>
            <button id="resetTuning" class="icon-button" type="button" aria-label="초기화" title="초기화">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 12a8 8 0 1 0 2.34-5.66"></path>
                <path d="M4 5v5h5"></path>
                <path d="M12 8v8"></path>
                <path d="M8 12h8"></path>
              </svg>
            </button>
            <button id="closeTuning" class="icon-button" type="button" aria-label="설정 닫기" title="설정 닫기">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12"></path>
                <path d="M18 6L6 18"></path>
              </svg>
            </button>
          </div>
        </header>

        <section class="setting-section setup-section is-open" data-section="collision">
          <div class="section-content">
            <div class="setup-area">
              <h2 class="setup-area-title">캐릭터</h2>
              <div class="select-row character-select-row">
                <span>선택</span>
                <select id="actorGroupSelect" aria-label="캐릭터 폴더"></select>
                <select id="actorSelect"></select>
                <div class="section-action-row character-actions" aria-label="캐릭터 관리">
                  <input id="characterPsdFile" class="hidden-file-input" type="file" accept=".psd" />
                  <input id="characterCreatePsdFile" class="hidden-file-input" type="file" accept=".psd" />
                  <div class="character-menu">
                    <button
                      id="characterMenuToggle"
                      class="icon-button"
                      type="button"
                      aria-haspopup="menu"
                      aria-expanded="false"
                      aria-label="캐릭터 작업 메뉴"
                      title="캐릭터 작업"
                    >
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="5" cy="12" r="1.5"></circle>
                        <circle cx="12" cy="12" r="1.5"></circle>
                        <circle cx="19" cy="12" r="1.5"></circle>
                      </svg>
                    </button>
                    <div id="characterMenu" class="character-menu-panel" role="menu" hidden>
                      <button id="characterAdd" class="character-menu-item" type="button" role="menuitem">
                        새 캐릭터 추가
                      </button>
                      <button id="characterPsdUpload" class="character-menu-item" type="button" role="menuitem">
                        PSD 업로드
                      </button>
                      <button id="characterPsdRefresh" class="character-menu-item" type="button" role="menuitem">
                        PSD 새로고침
                      </button>
                      <button id="characterPartReset" class="character-menu-item" type="button" role="menuitem">
                        파츠 위치 초기화
                      </button>
                      <div class="character-move-menu-wrap">
                        <button
                          id="characterMove"
                          class="character-menu-item"
                          type="button"
                          role="menuitem"
                          aria-haspopup="menu"
                          aria-expanded="false"
                        >
                          캐릭터 이동
                        </button>
                        <div
                          id="characterMoveMenu"
                          class="character-move-menu-panel"
                          role="menu"
                          aria-label="캐릭터 이동 대상"
                          hidden
                        >
                          <button
                            class="character-menu-item"
                            type="button"
                            role="menuitem"
                            data-character-move-group="players"
                          >
                            주인공
                          </button>
                          <button
                            class="character-menu-item"
                            type="button"
                            role="menuitem"
                            data-character-move-group="mobs"
                          >
                            잡몹
                          </button>
                          <button
                            class="character-menu-item"
                            type="button"
                            role="menuitem"
                            data-character-move-group="bosses"
                          >
                            보스
                          </button>
                          <button
                            class="character-menu-item"
                            type="button"
                            role="menuitem"
                            data-character-move-group="trash"
                          >
                            휴지통
                          </button>
                        </div>
                      </div>
                      <button id="characterDelete" class="character-menu-item danger" type="button" role="menuitem">
                        캐릭터 삭제
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <label class="select-row">
                <span>이름</span>
                <input id="actorName" type="text" maxlength="18" autocomplete="off" />
              </label>
              <label class="setting-row" data-field="maxHpPips">
                <span>HP</span>
                <input type="range" min="1" max="20" step="1" />
                <input type="number" min="1" max="20" step="1" />
              </label>
              <label class="setting-row" data-field="actorScale">
                <span>크기</span>
                <input type="range" min="0.4" max="2.4" step="0.05" />
                <input type="number" min="0.4" max="2.4" step="0.05" />
              </label>
              <label class="setting-row" data-field="hudOffsetY">
                <span>HUD 높이</span>
                <input type="range" min="-120" max="120" step="0.5" />
                <input type="number" min="-120" max="120" step="0.5" />
              </label>
            </div>
            <div class="setting-divider"></div>
            <div class="setup-area setup-subsection is-open" data-section="part">
              <h2 class="setup-area-title">파츠 위치</h2>
              <div class="part-position-layout">
                <div class="part-position-assets">
                  <div class="part-picker" data-picker="part" aria-label="파츠 위치와 판정 영역 선택"></div>
                  <label class="select-row native-part-select">
                    <span>조절할 부위</span>
                    <select id="partSelect"></select>
                  </label>
                </div>
                <div id="partFields" class="part-fields part-position-fields"></div>
              </div>
            </div>
            <div class="setting-divider"></div>
            <div class="setup-area setup-subsection is-open" data-section="layer">
              <h2 class="setup-area-title">레이어 순서</h2>
              <div id="layerOrder" class="layer-order" role="listbox" tabindex="0" aria-label="부위 레이어 순서"></div>
            </div>
          </div>
        </section>

        <div
          id="characterCreateDialog"
          class="character-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="characterCreateTitle"
          hidden
        >
          <div class="character-dialog-card">
            <h2 id="characterCreateTitle">새 캐릭터 만들기</h2>
            <label>
              <span>영어명</span>
              <input id="characterCreateEnglishName" type="text" maxlength="48" autocomplete="off" placeholder="crow" />
            </label>
            <label>
              <span>한글명</span>
              <input
                id="characterCreateKoreanName"
                type="text"
                maxlength="18"
                autocomplete="off"
                placeholder="까마귀"
              />
            </label>
            <label>
              <span>폴더</span>
              <select id="characterCreateGroup"></select>
            </label>
            <div class="character-dialog-actions">
              <button id="characterCreateCancel" type="button">취소</button>
              <button id="characterCreateChoosePsd" type="button">PSD 선택</button>
            </div>
          </div>
        </div>

        <section class="setting-section" data-section="action">
          <div class="section-content">
            <div class="select-row character-select-row action-select-row">
              <span>선택</span>
              <select id="actionGroupSelect" aria-label="Action 그룹"></select>
              <select id="actionSelect"></select>
              <div class="control-more-menu">
                <button
                  id="actionMenuToggle"
                  class="icon-button"
                  type="button"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  aria-label="Action 작업 메뉴"
                  title="Action 작업"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="5" cy="12" r="1.5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="19" cy="12" r="1.5"></circle>
                  </svg>
                </button>
                <div id="actionMenu" class="control-more-menu-panel" role="menu" hidden>
                  <button id="actionAdd" class="control-menu-item" type="button" role="menuitem">새 액션</button>
                  <button id="actionMove" class="control-menu-item" type="button" role="menuitem">액션 이동</button>
                  <button id="actionDelete" class="control-menu-item danger" type="button" role="menuitem">
                    액션 삭제
                  </button>
                </div>
              </div>
            </div>
            <div class="select-row action-name-trigger-row">
              <label for="actionName">이름</label>
              <input id="actionName" type="text" autocomplete="off" />
              <div class="action-trigger-card">
                <span id="actionTriggerRecordStatus" class="action-trigger-summary">없음</span>
                <button id="actionTriggerRecordComplete" class="action-trigger-mini-button" type="button" hidden>
                  완료
                </button>
                <button id="actionTriggerRecordCancel" class="action-trigger-mini-button" type="button" hidden>
                  취소
                </button>
                <button
                  id="actionTriggerRecord"
                  class="action-trigger-record-dot"
                  type="button"
                  aria-label="Trigger 녹화"
                  title="Trigger 녹화"
                ></button>
                <small id="actionTriggerHint" hidden></small>
                <select id="actionTriggerType" hidden>
                  <option value="single">단일</option>
                  <option value="sequence">연속</option>
                  <option value="holdCombo">홀드 조합</option>
                </select>
                <select id="actionTriggerSingleKey" hidden></select>
                <input id="actionTriggerSequenceKeys" type="text" autocomplete="off" hidden />
                <input id="actionTriggerMaxGapMs" type="hidden" value="350" />
                <select id="actionTriggerHoldKey" hidden></select>
                <select id="actionTriggerPressKey" hidden></select>
              </div>
            </div>
            <div class="timeline-settings">
              <div class="timeline-frame-input">
                <input id="actionDuration" type="number" min="2" max="50" step="1" />
                <div class="timeline-frame-steppers" aria-label="프레임 길이 조절">
                  <button id="actionFrameUp" type="button" aria-label="프레임 늘리기">▲</button>
                  <button id="actionFrameDown" type="button" aria-label="프레임 줄이기">▼</button>
                </div>
              </div>
              <button id="actionPlayback" class="icon-button" type="button" aria-label="재생">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5v14l11-7z"></path>
                </svg>
              </button>
              <button id="actionPlaybackMode" class="icon-button" type="button" aria-label="재생 방식: 한 번 재생">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5l10 7-10 7V5z"></path>
                  <path d="M5 5v14"></path>
                </svg>
              </button>
              <button
                id="actionMirror"
                class="icon-button is-active"
                type="button"
                aria-label="좌우 자동 거울상"
                title="좌우 자동 거울상"
                aria-pressed="true"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3v18"></path>
                  <path d="M5 6l5 3v6l-5 3V6z"></path>
                  <path d="M19 6l-5 3v6l5 3V6z"></path>
                </svg>
              </button>
              <button
                id="actionTriggerRepeat"
                class="icon-button"
                type="button"
                aria-label="한 번 실행"
                title="한 번 실행"
                aria-pressed="false"
                data-trigger-mode="tap"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7c2.4 1.5 4.7 2.7 6.5 4.8 1 1.2 1.2 2.6.4 3.6"></path>
                  <path d="M10.9 15.4c1.5 1.1 3.9.8 5.4-.7"></path>
                  <path d="M9.7 18.1l4.8-4.8 4.4 5.6-5.7 2.4-3.5-3.2z"></path>
                  <path d="M18.5 6.5v6"></path>
                </svg>
              </button>
              <button
                id="actionCondition"
                class="icon-button"
                type="button"
                aria-label="조건 없음"
                title="조건 없음"
                aria-pressed="false"
                data-condition="any"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="6"></circle>
                  <circle cx="12" cy="12" r="2"></circle>
                </svg>
              </button>
              <button
                id="actionAddKeyframe"
                class="icon-button"
                type="button"
                aria-label="새 키프레임"
                title="새 키프레임"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14"></path>
                  <path d="M5 12h14"></path>
                  <path d="M6 5h12"></path>
                </svg>
              </button>
              <button
                id="actionDeleteKeyframe"
                class="icon-button danger"
                type="button"
                aria-label="키프레임 삭제"
                title="키프레임 삭제"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 7h14"></path>
                  <path d="M9 7V5h6v2"></path>
                  <path d="M8 10l1 9h6l1-9"></path>
                  <path d="M10.5 13.5l3 3"></path>
                  <path d="M13.5 13.5l-3 3"></path>
                </svg>
              </button>
            </div>
            <div class="timeline-view" aria-label="Action 키프레임 타임라인">
              <div id="actionTimelineTrack" class="timeline-track"></div>
            </div>
            <div class="timeline-speed-control">
              <input id="actionPlaybackRateRange" type="range" min="0.1" max="4" step="0.05" aria-label="재생 속도" />
              <input id="actionPlaybackRate" type="number" min="0.1" max="4" step="0.05" aria-label="재생 속도" />
            </div>
            <div class="part-picker" data-picker="action" aria-label="Action 조절 부위 선택"></div>
            <label class="select-row native-part-select">
              <span>조절 부위</span>
              <select id="actionPartSelect"></select>
            </label>
            <div id="actionPartFields" class="part-fields"></div>
            <div id="motionSettingRows"></div>
          </div>
        </section>

        <section class="setting-section" data-collapsible data-section="effect">
          <button class="section-toggle" type="button">효과</button>
          <div class="section-content">
            <div class="action-select-row">
              <label class="select-row action-select-control">
                <span>선택</span>
                <select id="effectSelect"></select>
              </label>
              <div class="control-more-menu">
                <button
                  id="effectAssetMenuToggle"
                  class="icon-button"
                  type="button"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  aria-label="Effect 작업 메뉴"
                  title="Effect 작업"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="5" cy="12" r="1.5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="19" cy="12" r="1.5"></circle>
                  </svg>
                </button>
                <div id="effectAssetMenu" class="control-more-menu-panel" role="menu" hidden>
                  <input id="effectAssetFile" class="hidden-file-input" type="file" accept=".psd,.png,.webp" />
                  <button id="effectAssetUpload" class="control-menu-item" type="button" role="menuitem">
                    이미지 업로드
                  </button>
                  <button id="effectAssetRefresh" class="control-menu-item" type="button" role="menuitem">
                    이미지 새로고침
                  </button>
                  <button id="effectAssetReset" class="control-menu-item danger" type="button" role="menuitem">
                    현재 효과 초기화
                  </button>
                </div>
              </div>
            </div>
            <label class="action-name-trigger-row effect-name-row">
              <span>이름</span>
              <input id="effectName" type="text" readonly />
            </label>
            <div class="timeline-settings">
              <div class="timeline-frame-input">
                <input id="effectDuration" type="number" min="2" max="50" step="1" />
                <div class="timeline-frame-steppers" aria-label="효과 프레임 길이 조절">
                  <button id="effectFrameUp" type="button" aria-label="프레임 늘리기">▲</button>
                  <button id="effectFrameDown" type="button" aria-label="프레임 줄이기">▼</button>
                </div>
              </div>
              <button id="effectPlayback" class="icon-button" type="button" aria-label="효과 재생">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5v14l11-7z"></path>
                </svg>
              </button>
              <button id="effectPlaybackMode" class="icon-button" type="button" aria-label="재생 방식: 한 번 재생">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5l10 7-10 7V5z"></path>
                  <path d="M5 5v14"></path>
                </svg>
              </button>
              <div class="control-more-menu">
                <button
                  id="effectTimelineMenuToggle"
                  class="icon-button"
                  type="button"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  aria-label="Effect 타임라인 작업 메뉴"
                  title="Effect 타임라인 작업"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="5" cy="12" r="1.5"></circle>
                    <circle cx="12" cy="12" r="1.5"></circle>
                    <circle cx="19" cy="12" r="1.5"></circle>
                  </svg>
                </button>
                <div id="effectTimelineMenu" class="control-more-menu-panel" role="menu" hidden>
                  <button id="effectCopyFrame" class="control-menu-item" type="button" role="menuitem">
                    프레임 복사
                  </button>
                  <button id="effectPasteFrame" class="control-menu-item" type="button" role="menuitem">
                    프레임 붙여넣기
                  </button>
                  <button id="effectUndoFrame" class="control-menu-item" type="button" role="menuitem">
                    타임라인 되돌리기
                  </button>
                  <button id="effectAddKeyframe" class="control-menu-item" type="button" role="menuitem">
                    새 키프레임
                  </button>
                  <button id="effectDeleteKeyframe" class="control-menu-item danger" type="button" role="menuitem">
                    키프레임 삭제
                  </button>
                  <button id="effectResetAnimation" class="control-menu-item danger" type="button" role="menuitem">
                    효과 초기화
                  </button>
                </div>
              </div>
            </div>
            <div class="timeline-view" aria-label="효과 키프레임 타임라인">
              <div id="effectTimelineTrack" class="timeline-track"></div>
            </div>
            <div class="timeline-speed-control">
              <input
                id="effectPlaybackRateRange"
                type="range"
                min="0.1"
                max="4"
                step="0.05"
                aria-label="효과 재생 속도"
              />
              <input id="effectPlaybackRate" type="number" min="0.1" max="4" step="0.05" aria-label="효과 재생 속도" />
            </div>
            <div class="effect-picker">
              <div id="effectImagePreview" class="effect-image-preview" aria-hidden="true"></div>
            </div>
            <div id="effectFields" class="part-fields"></div>
          </div>
        </section>

        <section class="setting-section" data-collapsible data-section="scene">
          <button class="section-toggle" type="button">배경</button>
          <div class="section-content">
            <div class="section-action-row" aria-label="배경 PSD 작업">
              <input id="backgroundPsdFile" class="hidden-file-input" type="file" accept=".psd" />
              <button
                id="backgroundPsdUpload"
                class="icon-button"
                type="button"
                aria-label="로컬 PSD 파일 선택 및 업로드"
                title="로컬 PSD 파일 선택 및 업로드"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <path d="M14 2v6h6"></path>
                  <path d="M12 18v-7"></path>
                  <path d="M8 15l4-4 4 4"></path>
                </svg>
              </button>
              <button
                id="backgroundRefresh"
                class="icon-button"
                type="button"
                aria-label="기본 배경 파일 새로고침 및 업로드"
                title="기본 배경 파일 새로고침 및 업로드"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 12a8 8 0 0 1 13.66-5.66"></path>
                  <path d="M18 3v5h-5"></path>
                  <path d="M20 12a8 8 0 0 1-13.66 5.66"></path>
                  <path d="M6 21v-5h5"></path>
                </svg>
              </button>
              <button
                id="backgroundReset"
                class="icon-button"
                type="button"
                aria-label="배경 초기화"
                title="배경 초기화"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 12a8 8 0 1 0 2.34-5.66"></path>
                  <path d="M4 5v5h5"></path>
                  <path d="M12 8v8"></path>
                  <path d="M8 12h8"></path>
                </svg>
              </button>
            </div>
            <div id="backgroundLayerList" class="background-layer-list"></div>
          </div>
        </section>

        <div id="stageRulesPanelMount"></div>
      </aside>
    </main>

    <script type="module" src="./src/editor_local_only_guard.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
