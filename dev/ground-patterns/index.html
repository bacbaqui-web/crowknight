<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>풀·흙·길·타일·물 — 지형 24종</title>
    <style>
      body {
        margin: 24px;
        background: #e7e5d7;
        color: #28352d;
        font-family: system-ui;
      }
      h1 {
        font-size: 24px;
      }
      a {
        color: inherit;
      }
      #map {
        width: min(100%, 1000px);
        height: auto;
        border-radius: 12px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 12px;
      }
      figure {
        margin: 0;
        background: #cfd5c7;
        border-radius: 8px;
        overflow: hidden;
      }
      figure canvas {
        width: 100%;
        display: block;
      }
      figcaption {
        font-size: 13px;
        padding: 8px;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <h1>풀밭 · 흙 · 타일 · 길 · 물</h1>
    <p>기본 지형 8종 + 연결 패턴 16종. 실제 게임과 같은 재질·경계 합성으로 표시합니다.</p>
    <p><a href="../../quarter-view.html">게임 플레이</a></p>
    <p id="status">재질 로딩 중…</p>
    <canvas
      id="map"
      width="1000"
      height="600"
      aria-label="풀밭과 흙길, 돌길, 폐허 타일, 연못이 이어진 실제 지형 미리보기"
    ></canvas>
    <h2>24종 재질·연결 패턴</h2>
    <main id="patterns"></main>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
