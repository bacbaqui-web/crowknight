<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crow Knight · 효과음 후보 비교</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111518;
        color: #edf0ec;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 44px 24px;
      }
      small,
      .muted {
        color: #aab6b6;
      }
      h1 {
        font-size: 32px;
        margin: 8px 0;
      }
      header {
        margin-bottom: 30px;
      }
      header small {
        letter-spacing: 2px;
        color: #bbd9a3;
      }
      p {
        margin: 8px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      article {
        background: #1c2326;
        border: 1px solid #364246;
        border-radius: 16px;
        padding: 24px;
      }
      article.active {
        border-color: #bbd9a3;
      }
      h2 {
        font-size: 20px;
        margin: 10px 0 2px;
      }
      .num {
        color: #bbd9a3;
        font-size: 13px;
        letter-spacing: 2px;
      }
      audio {
        width: 100%;
        margin: 22px 0 12px;
      }
      a {
        color: #c6dfb3;
        text-underline-offset: 4px;
      }
      footer {
        margin-top: 24px;
        font-size: 14px;
      }
      #status {
        min-height: 26px;
        color: #bbd9a3;
      }
      button {
        font: inherit;
        background: #bbd9a3;
        border: 0;
        border-radius: 8px;
        padding: 9px 15px;
        color: #152114;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      label {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      @media (max-width: 620px) {
        main {
          padding: 24px 16px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 27px;
        }
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 20px 0;
      }
      nav button {
        background: #293438;
        color: #d6e2de;
      }
      nav button[aria-pressed='true'] {
        background: #bbd9a3;
        color: #152114;
      }
      article[hidden] {
        display: none;
      }
      .note {
        font-size: 14px;
        min-height: 45px;
      }
      .approved {
        color: #bbd9a3;
      }
      h2 {
        overflow-wrap: anywhere;
      }
      .duration {
        float: right;
        color: #aab6b6;
      }
      button {
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <small>CROW KNIGHT · SOUND AUDITION</small>
        <h1>전투 효과음 후보 비교</h1>
        <p class="muted">칼 14번의 네 번째·다섯 번째 구간 적용 · 새 방패·명중 후보 19~22번을 비교해 주세요.</p>
        <label><input id="loop" type="checkbox" /> 반복해서 듣기</label>
        <p id="status" aria-live="polite">한 번에 하나씩 재생됩니다.</p>
        <nav aria-label="효과음 종류" id="filters"></nav>
      </header>
      <section class="grid" id="candidates"></section>
      <footer>
        <p>
          원음 그대로 미리듣기 · 몽둥이 2·3번 / 폭발 10번 / 칼 14번 발췌 적용 · 발걸음은 기존 게임 소스를 유지합니다.
        </p>
        <p>
          Pixabay 음원 스트리밍 ·
          <a href="https://pixabay.com/service/license-summary/" target="_blank" rel="noopener">Content License</a>
        </p>
      </footer>
    </main>
    <script src="preview.js"></script>
  </body>
</html>
