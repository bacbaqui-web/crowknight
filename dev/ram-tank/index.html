<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><title>충각 전차장 동작 확인</title
  ><style>
    body {
      margin: 0;
      background: #242934;
      color: #eee;
      font: 16px sans-serif;
    }
    canvas {
      display: block;
      margin: auto;
    }
    p {
      text-align: center;
    }
    button {
      padding: 10px;
      margin: 4px;
    }
  </style>
  <p>
    충각 전차장 · 실제 게임 렌더러 <button id="idle">대기</button><button id="walk">이동</button
    ><button id="cast">돌진</button>
  </p>
  <canvas width="1100" height="650"></canvas>
  <script type="module">
    import { PuppetPlayer } from '../../src/actor_runtime_engine.js';
    import { CHARACTER_ASSET_PATHS, loadCharacterAssets } from '../../src/asset_loader_helper.js';
    import { requestRuntimeAction } from '../../src/action_trigger_engine.js';
    import {
      updateProjectileRuntime,
      drawProjectiles,
      activeProjectiles,
      resetProjectileRuntime,
    } from '../../src/projectile_runtime_engine.js';
    import { prepareTankMotion, finishTankMotion, tankPhase } from '../../src/ram_tank_runtime.js';
    import { mergeTuning } from '../../src/project_data_normalizer_helper.js';
    import { DEFAULT_PLAYER_TUNING } from '../../src/player_default_tuning_data.js';
    const data = await fetch('../../data/draft.json').then((r) => r.json());
    const def = data.actors.ram_tank;
    const sources = Object.fromEntries(
      Object.entries(CHARACTER_ASSET_PATHS)
        .filter(([k]) => def.assets.__parts.includes(k))
        .map(([k, v]) => [k, '../../assets/characters/bosses/ram_tank/' + v])
    );
    const assets = await loadCharacterAssets('bosses/ram_tank', '', { ...sources, __parts: def.assets.__parts });
    const effects = {};
    const player = new PuppetPlayer(230, 500, assets);
    player.applyTuning(mergeTuning(DEFAULT_PLAYER_TUNING, def.tuning));
    player.captureEditRegions = false;
    const actor = { id: 'ram_tank', player, group: 'bosses' },
      target = { id: 'target', player: { x: 750, y: 500 } };
    const world = { floorY: 500, gravity: 1800, minX: 0, maxX: 1100 };
    const ctx = document.querySelector('canvas').getContext('2d');
    let mode = 'idle';
    function choose(action) {
      mode = action;
      player.customActionKey = null;
      player.customActionTime = 0;
      player.tankCharge = null;
      player.x = 230;
      player.vx = 0;
      resetProjectileRuntime();
      if (action !== 'idle') requestRuntimeAction(player, action, 1, 'tap');
    }
    for (const [id, action] of [
      ['idle', 'idle'],
      ['walk', 'tankDrive'],
      ['cast', 'tankCharge'],
    ])
      document.querySelector('#' + id).onclick = () => choose(action);
    function render() {
      ctx.clearRect(0, 0, 1100, 650);
      ctx.strokeStyle = '#656c79';
      ctx.beginPath();
      ctx.moveTo(0, 500);
      ctx.lineTo(1100, 500);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath();
      ctx.ellipse(player.x, 500, 38, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      player.draw(ctx);
      ctx.fillStyle = '#eee';
      ctx.font = '22px sans-serif';
      const labels = { warning: '돌진 예고', charge: '돌진', brake: '제동', recovery: '빈틈' };
      ctx.fillText(
        player.actionKey === 'tankCharge' ? labels[tankPhase(player.customActionElapsed)] : '대기 / 접근',
        40,
        60
      );
      drawProjectiles(ctx, effects);
    }
    window.tankPreview = {
      player,
      actor,
      target,
      world,
      choose,
      render,
      activeProjectiles,
      step(dt) {
        const before = prepareTankMotion(actor);
        player.updateNpc(dt, target.player, world);
        finishTankMotion(actor, before, dt, world);
        updateProjectileRuntime({ actors: [actor], playerActor: target, world, dt });
        render();
      },
    };
    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.04, (now - last) / 1000);
      last = now;
      if (!window.manualPreview) {
        if (mode === 'tankDrive' && !player.isCustomActionActive) requestRuntimeAction(player, mode, 1, 'tap');
        tankPreview.step(dt);
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    render();
  </script>
</html>
